<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }} - Roz Nayi Shayari{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ if .IsPage }}{{ .Plain | truncate 150 }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<style>
:root{--bg:#fbf7f2;--card:#fff;--text:#2b2118;--muted:#8a7a6a;--accent:#b5462b;--line:#eadfd2}
@media(prefers-color-scheme:dark){:root{--bg:#17130f;--card:#221c16;--text:#f1e8dc;--muted:#a3937f;--accent:#e2805f;--line:#372e25}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Noto Serif Devanagari",serif;line-height:1.7}
a{color:inherit;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
header{border-bottom:1px solid var(--line);padding:18px 0}
header .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{font-size:1.4rem;font-weight:bold;color:var(--accent)}
nav a{margin-left:14px;color:var(--muted);font-size:.95rem}
nav a:hover{color:var(--accent)}
h1{font-size:1.6rem;margin:28px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;display:block}
.card:hover{border-color:var(--accent)}
.card h2{font-size:1.05rem;margin:0 0 8px;color:var(--accent)}
.poem{font-size:1.15rem;margin:0}
.meta{color:var(--muted);font-size:.85rem;margin-top:10px}
.tag{display:inline-block;background:var(--line);border-radius:20px;padding:2px 12px;font-size:.85rem;margin:3px 4px 3px 0}
.big{font-size:1.4rem;line-height:2;padding:10px 0}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-size:.95rem;cursor:pointer;margin-top:8px}
footer{border-top:1px solid var(--line);color:var(--muted);text-align:center;padding:24px 0;margin-top:40px;font-size:.9rem}
</style>
</head>
<body>
<header><div class="wrap">
<a class="logo" href="/">{{ .Site.Title }}</a>
<nav>
{{ range .Site.Taxonomies.category.Alphabetical }}<a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a>{{ end }}
<a href="/poet/">Shayar</a>
</nav>
</div></header>
<main class="wrap">
{{ block "main" . }}{{ end }}
</main>
<footer>&copy; {{ now.Year }} {{ .Site.Title }}</footer>
</body>
</html>
