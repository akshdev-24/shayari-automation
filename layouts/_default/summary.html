<article class="sher">
<p class="ttl">{{ with .Params.category }}{{ . }}{{ end }}</p>
<a href="{{ .RelPermalink }}"><p class="lines">{{ replace ((trim .RawContent "\n\r ") | htmlEscape) "\n" "<br>" | safeHTML }}</p></a>
<p class="by">{{ with .Params.poet }}&mdash; <b>{{ . }}</b>{{ else }}{{ .Date.Format "2 Jan 2006" }}{{ end }}</p>
</article>
